<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - RDWIS</title>
    <style>
        body {
            background-color: #0d0f14;
            color: #e8ecf4;
            font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            color: #4f8cff;
            margin-bottom: 10px;
        }
        p {
            color: #8b91a8;
            margin-top: 0;
        }
        .btn {
            background-color: #4f8cff;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background-color: #3b6ecc;
        }
    </style>
</head>
<body>
    <div>
        <h1>Server Connecting / Offline</h1>
        <p id="status-text">Server is starting or offline. Please wait or check your connection...</p>
        <div style="margin-top: 15px;">
            <a href="/login" class="btn" id="retry-btn">Retry Now</a>
        </div>
        <p style="font-size: 12px; color: #5a6275; margin-top: 15px;">
            Auto-reconnecting every 2 seconds...
        </p>
    </div>

    <script>
        function checkServer() {
            fetch('/login', { method: 'HEAD', cache: 'no-store' })
                .then(function(res) {
                    if (res.ok || res.status === 200 || res.status === 302 || res.type === 'opaqueredirect') {
                        document.getElementById('status-text').innerText = 'Server detected! Redirecting...';
                        window.location.href = '/login';
                    } else {
                        setTimeout(checkServer, 2000);
                    }
                })
                .catch(function() {
                    setTimeout(checkServer, 2000);
                });
        }

        // Start polling immediately
        setTimeout(checkServer, 1000);

        window.addEventListener('online', function() {
            window.location.href = '/login';
        });

        document.getElementById('retry-btn').addEventListener('click', function(e) {
            e.preventDefault();
            this.innerText = 'Connecting...';
            window.location.href = '/login';
        });
    </script>
</body>
</html>
